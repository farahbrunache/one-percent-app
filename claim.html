<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your session — One Percent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">

  <a class="back" href="https://farahbrunache.com">&larr; One Percent</a>

  <h1>Your session</h1>

  <div id="body" aria-live="polite"></div>

  <footer class="stack gap-s">
    <p>
      Save this link. It's the only record of your order, and nothing about you was saved that
      could find it any other way.
    </p>
    <p class="actions" style="margin-top:0.3rem;">
      <button type="button" class="quiet" id="copylink">Copy this page's link</button>
    </p>
    <p>
      Lost it? <a href="/buy">Enter your reference or gift card code</a> and you get a new link.
    </p>
  </footer>

</main>

<script type="module">
  // Pinned rather than whatever that address serves today. The server creates the call with a
  // pinned library, and the two halves have to agree about the room being joined; a silent
  // upgrade on one side is a call that stops with a short sentence and no reason.
  const VOICE_CLIENT = 'https://cdn.jsdelivr.net/npm/retell-client-js-sdk@3.0.1/+esm';
  const body = document.getElementById('body');
  const token = new URLSearchParams(location.search).get('t');

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function clear() { body.textContent = ''; }

  function lede(text) { body.append(el('p', text, 'lede')); }

  function statusLine(label, value) {
    const wrap = el('div', null, 'status-line');
    wrap.append(el('div', label, 'label'));
    wrap.append(el('div', value, 'value'));
    body.append(wrap);
    return wrap;
  }

  function note(lines) {
    const box = el('div', null, 'note stack gap-s');
    for (const line of lines) box.append(el('p', line));
    body.append(box);
  }

  function render(data) {
    clear();

    if (data.status === 'pending') {
      statusLine('Status', 'Waiting on your payment');

      if (data.payTo) {
        lede(`Send $7 by ${data.label}, with your reference in the note.`);
        const wrap = el('div', null, 'status-line');
        wrap.append(el('div', `Send $7 by ${data.label}`, 'label'));
        if (/^https?:\/\//i.test(data.payTo)) {
          const value = el('div', null, 'value');
          const a = el('a', 'Open the payment page');
          a.href = data.payTo;
          a.rel = 'noopener noreferrer';
          a.target = '_blank';
          value.append(a);
          const raw = el('div', data.payTo, 'meta mono');
          raw.style.cssText = 'margin-top:0.4rem;font-size:0.85rem;word-break:break-all;';
          value.append(raw);
          wrap.append(value);
        } else {
          wrap.append(el('div', data.payTo, 'value mono'));
        }
        body.append(wrap);
      } else {
        lede("Your card is in and hasn't been checked yet. A person checks it, so it isn't instant.");
      }

      if (data.reference) {
        body.append(el('p', data.payTo ? 'Put this in the note:' : 'Your reference:', 'lede'));
        body.append(el('div', data.reference, 'big-code'));
      }

      note([
        'Come back to this page. Once the payment is matched, the button to start your session appears here.',
        'Nothing gets sent to you, because nothing about you was saved to send it to.',
      ]);
      return;
    }

    if (data.status === 'rejected') {
      statusLine('Status', "That payment didn't check out");
      lede(data.reason || "The card didn't check out.");
      note([
        'No session was opened, and nothing was charged for this order.',
        "If you think that's wrong, start a new order — nothing was charged for this one.",
      ]);
      return;
    }

    // The call has happened. This page said so and stopped, which left somebody who had just
    // spoken with nothing to do and no idea anything else was coming. What they are waiting
    // for is the writing, and the only thing they have to do is come back here.
    if (data.status === 'used') {
      // Two screens, and which one depends on whether anything has been written yet.
      //
      // There was one, and it asked for a sign-in the moment the call ended: money taken, call
      // had, nothing delivered, now make an account. Nothing had been read and nothing had
      // been written, so the ask came before there was anything to sign in for. Once the sheet
      // exists it is a fair trade -- sign in and read what somebody wrote for you -- and that
      // is the only point at which it is asked.
      statusLine('Status', 'Your call is done');

      if (!data.recommended) {
        lede('Your call happened. A person reads it and writes you what to do next.');
        note([
          'Come back to this page in about 48 hours. What was written for you will be here.',
          'Nothing is needed from you in the meantime, and this link keeps working.',
        ]);
        return;
      }

      lede('Your call was read, and what to do next is written.');
      note([
        'Sign in with a Skills Economy account to read it. That is also how you get back to it '
          + 'later.',
        'This link keeps working either way.',
      ]);
      const go = el('p', null, 'cta');
      const link = el('a', 'Sign in and read it');
      link.href = '/';
      go.append(link);
      body.append(go);

      // Another session is offered here and not on the screen above it, for the same reason
      // the sign-in is: selling somebody a second conversation before the first one has
      // produced anything is asking twice and delivering none.
      const again = el('p', null, 'cta after');
      again.textContent = 'Another conversation is another session.';
      body.append(again);
      const buy = el('p', null, 'cta');
      const buyLink = el('a', 'Pay for another session');
      buyLink.href = '/buy';
      buy.append(buyLink);
      body.append(buy);
      return;
    }

    if (data.status === 'confirmed') {
      statusLine('Status', 'Your session is ready');

      lede('This runs in your browser. It asks for your microphone first, then counts down and '
        + 'starts talking. Up to thirty minutes, and it asks nothing of you beforehand.');

      const start = el('p', null, 'cta');
      const button = document.createElement('button');
      button.type = 'button';
      button.id = 'start';
      button.textContent = 'Start my session';
      start.append(button);
      body.append(start);

      const liveMsg = el('div');
      liveMsg.id = 'callmsg';
      liveMsg.setAttribute('aria-live', 'polite');
      body.append(liveMsg);

      note([
        "It's an automated assistant, not a person. It runs for up to thirty minutes and it "
          + "goes through what you do, what you'd charge, who your first customer is, and one "
          + 'thing to do next. It ends once those are answered, which is often sooner than the '
          + "half hour — a short call is a finished one, not a cut-off one.",
        'A person reads everything it writes down.',
        'If it drops, come back to this page and start it again. It opens a few times in one '
          + "day, which covers a call that fails without letting the link get passed around.",
      ]);

      button.addEventListener('click', () => startSession(button, liveMsg));

      return;
    }

    lede("This order is in a state this page doesn't recognize.");
  }

  // If they are already signed in when they open their link, bind it now. Nothing is shown
  // about it: a silent success needs no announcement, and a failure here changes nothing —
  // the link still works, which is what this page is for.
  async function linkQuietly() {
    if (!token) return;
    try {
      await fetch('/api/client?action=link', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ t: token }),
      });
    } catch {
      // Not signed in, or already held by another account. Neither is this page's business.
    }
  }

  async function load() {
    if (!token) {
      clear();
      lede('This link is missing its claim token.');
      note(['Open the link you were given in full, or recover it with your card code from the payment page.']);
      return;
    }
    try {
      const response = await fetch(`/api/status?t=${encodeURIComponent(token)}`);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `The server returned ${response.status}.`);
      try { localStorage.setItem('onepercent.claim', location.pathname + location.search); } catch {}
      render(data);
      linkQuietly();
    } catch (error) {
      clear();
      lede(error.message);
    }
  }

  function callMessage(target, text, kind) {
    target.textContent = '';
    target.className = 'msg ' + (kind || '');
    target.append(el('p', text));
  }

  // Why the microphone is asked for here, before anything else happens: a browser that will
  // not allow it was never going to work, and finding that out after the session has been
  // opened spends one of three starts on a call that cannot happen.
  async function microphone(target) {
    if (!navigator.mediaDevices?.getUserMedia) {
      callMessage(
        target,
        "This browser won't let the page use a microphone at all. Open this link in Safari, "
          + 'Chrome or Firefox and it will work.',
        'bad',
      );
      return false;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      // Permission is all that was wanted. The voice client opens its own.
      for (const track of stream.getTracks()) track.stop();
      return true;
    } catch (error) {
      const name = error?.name || '';
      if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        callMessage(target, 'This device has no microphone the browser can find.', 'bad');
      } else if (name === 'NotReadableError') {
        callMessage(
          target,
          'Something else on this device has the microphone. Close any other call or '
            + 'recording and try again.',
          'bad',
        );
      } else {
        // Everything else is the browser refusing, and most of the time it refused without
        // ever asking. Say what to change rather than what went wrong.
        callMessage(
          target,
          "This browser isn't letting the page ask for your microphone. Check its privacy "
            + 'settings and allow the microphone prompt to appear, then reload this page. On '
            + 'an iPhone, turning off Lockdown Mode for this site is usually what does it.',
          'bad',
        );
      }
      return false;
    }
  }

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  // Said once, after the call rather than before it: beforehand it is one more thing to read
  // on a page somebody is about to be spoken to from, and it would be the only mention of an
  // account on a page that promises none is needed.
  function afterwards() {
    if (document.getElementById('afterwards')) return;
    const box = document.createElement('section');
    box.id = 'afterwards';
    box.append(el('h3', 'Seeing this again later'));
    box.append(el('p',
      "Keep this link — it's how you get back to this page. If you'd rather not keep "
      + 'track of a link, sign in at this site with Skills Economy and paste it once, and '
      + 'this session will be on your account from then on.'));
    const go = el('p', null, 'cta');
    const a = el('a', 'Sign in and keep this session', 'button quiet-link');
    a.href = '/';
    go.append(a);
    box.append(go);
    box.append(el('p',
      "You don't need an account for anything you've already done, and signing in doesn't "
      + 'buy or unlock anything.', 'meta'));
    document.querySelector('main').append(box);
  }

  async function startSession(button, target) {
    button.disabled = true;

    callMessage(target, 'Allow the microphone when your browser asks.');
    if (!(await microphone(target))) {
      button.disabled = false;
      return;
    }

    callMessage(target, 'Opening the session…');
    let data;
    try {
      const response = await fetch('/api/call', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ t: token }),
      });
      data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `The server returned ${response.status}.`);
    } catch (error) {
      callMessage(target, error.message, 'bad');
      button.disabled = false;
      return;
    }

    let RetellWebClient;
    try {
      ({ RetellWebClient } = await import(VOICE_CLIENT));
    } catch {
      callMessage(
        target,
        "Your session opened but this browser couldn't load the voice client. Try a different "
          + 'browser — Chrome, Safari or Firefox, kept up to date.',
        'bad',
      );
      return;
    }

    // It speaks the moment it connects, and its first sentence is the one saying it is not a
    // person and that the session is recorded. Counting in costs three seconds of thirty
    // minutes and means somebody is listening when that sentence is said.
    for (const count of [3, 2, 1]) {
      callMessage(target, `Starting in ${count}. It speaks as soon as it connects.`);
      await wait(1000);
    }

    try {
      const client = new RetellWebClient();
      client.on('call_started', () => callMessage(target, 'You are connected. Speak when ready.', 'good'));
      client.on('call_ended', () => {
        callMessage(target, 'The session has ended. A person reads what was written down.', 'good');
        button.disabled = false;
        button.textContent = 'Start again';
        afterwards();
      });
      client.on('error', (err) => {
        callMessage(target, `The session stopped. ${describeFailure(err, data.callId)}`, 'bad');
        button.disabled = false;
        neverConnected(data.callId);
      });
      await client.startCall({
        accessToken: data.accessToken,
        callId: data.callId,
        transport: data.transport || undefined,
        iceServers: data.iceServers || undefined,
      });
    } catch (error) {
      callMessage(
        target,
        `The session did not start. ${describeFailure(error, data.callId)} Reload this page `
          + 'and press the button again — your minutes are still there.',
        'bad',
      );
      button.disabled = false;
      neverConnected(data.callId);
    }
  }

  // Tell the server the session never connected, so the minutes it reserved go back.
  //
  // A call left open counts as the whole budget, because from the server's side a call it has
  // heard nothing about may still be running. Without this, one failure to join spends the
  // order and there is no way to start another -- which is what happened the first time one
  // failed.
  //
  // Nothing is shown if this fails. The reader already has a failure on screen and a second
  // one about bookkeeping helps nobody; the server closes the call on its own timer anyway.
  function neverConnected(callId) {
    if (!callId) return;
    fetch('/api/call?action=abandon', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ t: token, callId }),
    }).catch(() => {});
  }

  // Everything the failure carried, not the one line of it that happens to be a message.
  //
  // A voice call fails in a browser for reasons that live in three different places -- a
  // refused microphone, a device that is not there, a room the token no longer opens -- and
  // the client reports all of them through the same event with the same short sentence. The
  // detail is on the object rather than in the sentence, so the sentence alone is unusable.
  //
  // What it puts on screen: the sentence, whatever fields came with it, the call's own id so
  // it can be looked up in the voice service's dashboard, and the version of the client that
  // was loaded, because the page takes whatever that address currently serves.
  function describeFailure(failure, callId) {
    const parts = [];
    const seen = new Set();

    const add = (label, value) => {
      if (value === undefined || value === null || value === '') return;
      const text = typeof value === 'string' ? value : String(value);
      if (!text || text === '[object Object]' || seen.has(text)) return;
      seen.add(text);
      parts.push(label ? `${label}: ${text}` : text);
    };

    if (failure instanceof Error || (failure && typeof failure === 'object')) {
      add(null, failure.message || failure.reason || failure.error || String(failure));
      // Named separately as well: when a message is present these carry the part of the
      // reason the message left out, and the set above drops them when they repeat it.
      add('reason', failure.reason);
      add('error', typeof failure.error === 'string' ? failure.error : undefined);
      add('name', failure.name);
      add('code', failure.code);
      add('status', failure.status);
      for (const [key, value] of Object.entries(failure)) {
        if (['message', 'reason', 'error', 'name', 'code', 'status', 'stack'].includes(key)) continue;
        if (value && typeof value === 'object') continue;
        add(key, value);
      }
      let cause = failure.cause;
      for (let depth = 0; cause && depth < 3; depth += 1) {
        add('caused by', cause.message || String(cause));
        cause = cause.cause;
      }
    } else {
      add(null, String(failure));
    }

    if (callId) parts.push(`call ${callId}`);
    parts.push(`client ${VOICE_CLIENT}`);

    // The raw object as well, because an object nested inside it cannot be put on a page and
    // is sometimes the only place the real reason is written.
    console.error('[one-percent] the session failed', failure);

    const said = parts.join(' · ');

    // The client reports a failure to start as a bare sentence and logs the real one to the
    // browser's own console, so on screen there is nothing else to show and saying where it
    // went is the only useful thing left.
    const bare = typeof failure === 'string' || (parts.length <= 2 && !failure?.name);
    return `${said}. If the browser asked for the microphone and it was refused, or there is `
      + 'no microphone on this device, that is what this says.'
      + (bare ? ' The reason itself is in the browser console, under Error starting call.' : '');
  }

  const copy = document.getElementById('copylink');
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      copy.textContent = 'Copied';
    } catch {
      copy.textContent = 'Copy it from the address bar';
    }
    setTimeout(() => { copy.textContent = "Copy this page's link"; }, 2500);
  });

  load();
</script>
</body>
</html>
