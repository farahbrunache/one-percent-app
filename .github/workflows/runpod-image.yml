name: Build the RunPod worker image

# Pressed by hand, never on a push. The image is gigabytes and holds a model that changes a
# few times a year, so building it on every commit would spend minutes and disk for nothing.
#
# It publishes to this repository's own container registry, which means no second repository
# to create and no build triggered by ordinary work here. RunPod pulls the tag by name.
#
# This is not a one-shot workflow and is not deleted: it runs again every time the model
# changes.

on:
  workflow_dispatch:
    inputs:
      model:
        description: The Ollama model to bake in, e.g. llama3.2
        required: true
        default: llama3.2

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The runner ships with about 14 GB free and the image is several of them, so the
      # tooling nobody here uses is removed first. Without this the build dies partway
      # through the model pull with a disk error that reads like a network fault.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag carries the model name, so two models can exist at once and the endpoint
      # moves between them by changing a tag rather than by a rebuild nobody can undo.
      - name: Name the tag after the model
        id: tag
        run: |
          model='${{ inputs.model }}'
          safe=$(printf '%s' "$model" | tr -c 'a-zA-Z0-9._-' '-')
          echo "ref=ghcr.io/${{ github.repository_owner }}/one-percent-runpod:$safe" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: runpod
          push: true
          build-args: OLLAMA_MODEL=${{ inputs.model }}
          tags: ${{ steps.tag.outputs.ref }}

      - name: Say what to point the endpoint at
        run: |
          {
            echo '## The image is published'
            echo
            echo 'Point the RunPod endpoint at this, and put it in the `one percent` cost center:'
            echo
            echo '```'
            echo '${{ steps.tag.outputs.ref }}'
            echo '```'
            echo
            echo 'The package is private until it is made public on the repository packages page.'
            echo 'RunPod cannot pull a private one without credentials, so make it public there.'
          } >> "$GITHUB_STEP_SUMMARY"
