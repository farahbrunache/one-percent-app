name: Check

# One run per commit. Running on every branch push as well as on pull_request meant a pull
# request got two identical runs, which GitHub reports as an unstable head and which refuses
# auto-merge until the duplicate finishes. So this checks pull requests only — the trunk is
# checked by the deploy workflow, which runs the same two commands before it ships anything.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
        env:
          # Test-only values. Nothing real is needed, because no test reaches a database.
          CARD_ENCRYPTION_KEY: test-key-that-is-long-enough-to-pass-0123456789
