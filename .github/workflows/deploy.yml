name: Deploy

# Every deploy comes from here, never from Render watching the repository. The checks run
# first, so a commit that fails them cannot reach anybody who has paid.
#
# Settings come from Infisical and are written to Render on the way past, so a value is
# entered once, in one place, and never typed into a hosting dashboard.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, sync settings, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
        env:
          # Test-only values. No test reaches a database or a network.
          CARD_ENCRYPTION_KEY: test-key-that-is-long-enough-to-pass-0123456789

      # Infisical can only be administered from a laptop, so this has to work before one
      # exists. Without those secrets the settings step is skipped and Render deploys with
      # what it already holds; adding them later switches it over with no code change.
      - name: Is Infisical configured yet?
        id: settings
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PROJECT_ID" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      # No command line to install. The runner already has curl and jq, the script already
      # parses JSON with them, and an install step that reaches out to a third party's
      # repository is a way for a deploy to stop working on a day nobody touched it — which is
      # what happened: the setup script stopped resolving, the pipe into bash swallowed the
      # failure because bash reads an empty script and exits clean, and apt then reported a
      # package that was never added.
      #
      # Piping somebody else's script into root on every deploy was worth removing on its own.
      - name: Sign in to Infisical
        id: infisical
        if: steps.settings.outputs.ready == 'yes'
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_API_URL: ${{ secrets.INFISICAL_URL }}
        run: |
          set -euo pipefail
          # Whatever was pasted, use only the scheme and host. This value is copied out of a
          # browser address bar, so it arrives with the project path still on the end more often
          # than not — and that produces a 404 naming a route nobody wrote, which reads like the
          # API being wrong rather than the setting.
          origin=$(printf '%s' "$INFISICAL_API_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          [ -n "$origin" ] || { echo "::error title=INFISICAL_URL is not an address::It has to start with https:// and a host name."; exit 1; }
          response=$(curl -sS --fail-with-body --max-time 30 \
            -X POST "$origin/api/v1/auth/universal-auth/login" \
            -H 'content-type: application/json' \
            -d "$(jq -n --arg id "$INFISICAL_CLIENT_ID" --arg secret "$INFISICAL_CLIENT_SECRET" \
                  '{clientId: $id, clientSecret: $secret}')") || {
            echo "::error title=Infisical would not sign in::It answered: $response"
            exit 1
          }
          token=$(printf '%s' "$response" | jq -r '.accessToken // empty')
          if [ -z "$token" ]; then
            # The body is the only way to tell a wrong credential from a wrong address, and it
            # carries no secret of its own.
            echo "::error title=Infisical returned no token::It answered: $response"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Put the settings on Render and deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_NAME: one-percent-app
          INFISICAL_TOKEN: ${{ steps.infisical.outputs.token }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_API_URL: ${{ secrets.INFISICAL_URL }}
        run: bash .github/scripts/deploy.sh
