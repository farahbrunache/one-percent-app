<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payments — One Percent</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">

  <h1>Payments</h1>

  <div id="signin" hidden>
    <p class="lede">Sign in with Skills Economy to see what is waiting.</p>
    <div class="actions"><a class="button" id="lgo" href="/api/auth?action=start&amp;to=/admin">Sign in with Skills Economy</a></div>
    <div id="lmsg" hidden></div>
  </div>

  <div id="starting"><p class="meta">Checking who you are.</p></div>

  <div id="work" hidden>
    <div id="counts" class="status-line"></div>
    <div class="actions">
      <button type="button" class="quiet" id="refresh">Refresh</button>
      <button type="button" class="quiet" id="logout">Sign out</button>
    </div>
    <div id="rows" class="rows" aria-live="polite"></div>

    <h2>Everything so far</h2>
    <form class="fields" id="search" novalidate>
      <div class="field">
        <label for="q">Find a reference</label>
        <input id="q" type="search" inputmode="latin" autocapitalize="characters"
               autocomplete="off" placeholder="Whole reference, as they typed it">
      </div>
      <div class="actions">
        <button type="submit" class="quiet">Find</button>
        <button type="button" class="quiet" id="clear">Show all</button>
      </div>
    </form>
    <p class="meta" id="hcount"></p>
    <div id="history" class="rows" aria-live="polite"></div>
    <div class="actions" id="pager" hidden>
      <button type="button" class="quiet" id="prev">Newer</button>
      <button type="button" class="quiet" id="next">Older</button>
    </div>
  </div>

</main>

<script type="module">
  const REASONS = {
    not_received: 'Nothing arrived',
    short: 'Less than $7 arrived',
    empty: 'Gift card had no balance',
    used: 'Gift card already redeemed',
    invalid: 'Gift card code did not work',
    duplicate: 'Already submitted here',
  };

  const signin = document.getElementById('signin');
  const starting = document.getElementById('starting');
  const work = document.getElementById('work');
  const rows = document.getElementById('rows');
  const counts = document.getElementById('counts');

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function msg(id, text, kind) {
    const box = document.getElementById(id);
    box.hidden = false;
    box.className = 'msg ' + (kind || '');
    box.textContent = text;
  }

  async function call(url, options) {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `The server returned ${response.status}.`);
    return data;
  }

  function renderCounts(map) {
    counts.textContent = '';
    counts.append(el('div', 'Waiting on you', 'label'));
    counts.append(el('div', String(map.pending || 0), 'value'));
    const rest = el('p', null, 'meta');
    rest.style.marginTop = '0.5rem';
    rest.textContent = `${map.confirmed || 0} confirmed · ${map.rejected || 0} rejected`;
    counts.append(rest);
  }

  function renderRow(order) {
    const row = el('div', null, 'row');
    row.append(el('div', `${order.label} · $${order.amount.toFixed(2)}`, null));
    row.append(el('div', new Date(order.submitted).toLocaleString(), 'meta'));

    // The reference is what to look for in Wise. The code only exists on a card.
    row.append(el('div', order.reference, 'code'));
    if (order.code) row.append(el('div', order.code, 'code'));

    const copies = el('div', null, 'actions');
    const decide = el('div', null, 'actions');
    const reject = el('div', null, 'actions');

    function copyButton(label, text) {
      const b = el('button', label, 'quiet');
      b.type = 'button';
      b.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          b.textContent = 'Copied';
        } catch {
          b.textContent = 'Select it by hand';
        }
        setTimeout(() => { b.textContent = label; }, 1500);
      });
      return b;
    }

    copies.append(copyButton('Copy reference', order.reference));
    if (order.code) copies.append(copyButton('Copy card code', order.code));

    const confirm = el('button', 'Confirm');
    confirm.type = 'button';
    confirm.style.flex = '1';
    confirm.addEventListener('click', async () => {
      confirm.disabled = true;
      try {
        await call('/api/admin?action=decide', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: order.id, decision: 'confirm' }),
        });
        await load();
      } catch (error) {
        row.append(el('p', error.message, 'meta'));
        confirm.disabled = false;
      }
    });
    decide.append(confirm);

    const reason = document.createElement('select');
    reason.setAttribute('aria-label', 'Reason for rejecting');
    reason.style.width = 'auto';
    for (const [value, label] of Object.entries(REASONS)) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      reason.append(option);
    }
    reason.style.flex = '1';
    reject.append(reason);

    const rejectButton = el('button', 'Reject', 'danger');
    rejectButton.type = 'button';
    rejectButton.addEventListener('click', async () => {
      rejectButton.disabled = true;
      try {
        await call('/api/admin?action=decide', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: order.id, decision: 'reject', reason: reason.value }),
        });
        await load();
      } catch (error) {
        row.append(el('p', error.message, 'meta'));
        rejectButton.disabled = false;
      }
    });
    reject.append(rejectButton);

    row.append(copies);
    row.append(decide);
    row.append(reject);
    return row;
  }

  function when(value) {
    return value ? new Date(value).toLocaleString() : null;
  }

  function renderHistoryRow(order) {
    const row = el('div', null, 'row');
    row.append(el('div', `${order.label} · $${order.amount.toFixed(2)}`, null));
    row.append(el('div', order.reference, 'code'));

    const status = el('div', null, 'meta');
    if (order.status === 'confirmed') {
      status.textContent = `Confirmed ${when(order.decided)}`;
    } else if (order.status === 'rejected') {
      status.textContent = `Rejected ${when(order.decided)} — ${order.rejectReason || 'no reason recorded'}`;
    } else {
      status.textContent = 'Waiting on you';
    }
    row.append(status);

    const session = el('div', null, 'meta');
    if (order.sessionStarts > 0) {
      const times = order.sessionStarts === 1 ? 'once' : `${order.sessionStarts} times`;
      session.textContent = `Session started ${times}, first at ${when(order.firstStarted)}`;
    } else if (order.status === 'confirmed') {
      session.textContent = 'Session never started';
    } else {
      session.textContent = `Submitted ${when(order.submitted)}`;
    }
    row.append(session);

    if (order.hasTranscript) {
      const length = order.callSeconds
        ? `${Math.round(order.callSeconds / 60)} minutes`
        : 'the session';
      const actions = el('div', null, 'actions');
      const show = el('button', `Read ${length}`, 'quiet');
      show.type = 'button';
      const box = el('div', null, 'transcript');
      box.hidden = true;

      let loaded = null;
      async function fetchOnce() {
        if (!loaded) loaded = await call(`/api/admin?action=transcript&id=${order.id}`);
        return loaded;
      }

      show.addEventListener('click', async () => {
        if (!box.hidden) {
          box.hidden = true;
          show.textContent = `Read ${length}`;
          return;
        }
        show.disabled = true;
        try {
          const data = await fetchOnce();
          box.textContent = '';
          box.append(el('pre', data.transcript, null));
          box.hidden = false;
          show.textContent = 'Hide';
        } catch (error) {
          box.textContent = '';
          box.append(el('p', error.message, 'meta'));
          box.hidden = false;
        } finally {
          show.disabled = false;
        }
      });

      // The owner reads this on a phone and starts the next conversation from it somewhere
      // else, so getting it out as plain text is the point rather than a convenience.
      const copy = el('button', 'Copy the transcript', 'quiet');
      copy.type = 'button';
      copy.addEventListener('click', async () => {
        copy.disabled = true;
        try {
          const data = await fetchOnce();
          await navigator.clipboard.writeText(data.transcript);
          copy.textContent = 'Copied';
        } catch {
          copy.textContent = 'Open it and select it by hand';
        }
        setTimeout(() => { copy.textContent = 'Copy the transcript'; copy.disabled = false; }, 2000);
      });

      actions.append(show);
      actions.append(copy);
      row.append(actions);
      row.append(box);
    }

    return row;
  }

  let hpage = 1;
  let hquery = '';

  async function loadHistory() {
    const history = document.getElementById('history');
    const pager = document.getElementById('pager');
    const params = new URLSearchParams({ action: 'history', page: String(hpage) });
    if (hquery) params.set('q', hquery);
    try {
      const data = await call(`/api/admin?${params.toString()}`);
      history.textContent = '';
      const first = (data.page - 1) * data.perPage + 1;
      const last = Math.min(data.page * data.perPage, data.total);
      const counter = document.getElementById('hcount');
      if (!data.total) {
        counter.textContent = data.searched
          ? `Nothing here with the reference ${data.searched}.`
          : 'Nothing has been through here yet.';
        pager.hidden = true;
        return;
      }
      counter.textContent = data.searched
        ? `${data.total} with the reference ${data.searched}.`
        : `${first} to ${last} of ${data.total}, newest first.`;
      for (const order of data.orders) history.append(renderHistoryRow(order));
      pager.hidden = data.total <= data.perPage;
      document.getElementById('prev').disabled = data.page <= 1;
      document.getElementById('next').disabled = last >= data.total;
    } catch (error) {
      history.textContent = '';
      history.append(el('p', error.message, 'meta'));
      pager.hidden = true;
    }
  }

  document.getElementById('search').addEventListener('submit', (event) => {
    event.preventDefault();
    hquery = document.getElementById('q').value.trim();
    hpage = 1;
    loadHistory();
  });
  document.getElementById('clear').addEventListener('click', () => {
    document.getElementById('q').value = '';
    hquery = '';
    hpage = 1;
    loadHistory();
  });
  document.getElementById('prev').addEventListener('click', () => {
    if (hpage > 1) { hpage -= 1; loadHistory(); }
  });
  document.getElementById('next').addEventListener('click', () => {
    hpage += 1;
    loadHistory();
  });

  async function load() {
    try {
      const data = await call('/api/admin?action=list');
      signin.hidden = true;
      work.hidden = false;
      renderCounts(data.counts || {});
      rows.textContent = '';
      if (!data.pending.length) {
        rows.append(el('p', 'Nothing waiting.', 'meta'));
      } else {
        for (const order of data.pending) rows.append(renderRow(order));
      }
      await loadHistory();
    } catch (error) {
      starting.hidden = true;
      signin.hidden = false;
      work.hidden = true;
      if (!/^sign in with skills economy first/i.test(error.message)) {
        msg('lmsg', error.message, 'bad');
      }
    }
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('logout').addEventListener('click', async () => {
    await call('/api/auth?action=signout', { method: 'POST' });
    location.replace('/admin');
  });

  // A sign-in that failed comes back here with the reason in the address. Take it out of the
  // address bar once it is on the page, so a refresh does not show it again.
  const problem = new URLSearchParams(location.search).get('problem');
  if (problem) {
    history.replaceState(null, '', '/admin');
    signin.hidden = false;
    starting.hidden = true;
    msg('lmsg', problem, 'bad');
  } else {
    load().finally(() => { starting.hidden = true; });
  }
</script>
</body>
</html>
