# One Percent runs as one small web service. Not serverless: a chat that streams an answer
# and a screen that watches a conversation both need a connection that stays open, and a
# function that is billed by the request cannot hold one.
services:
  - type: web
    name: one-percent-app
    runtime: node
    plan: starter
    # Ohio, because Charging The Future's services and the Neon database are there. Render
    # defaults to Oregon, which would put every query on a round trip across the continent,
    # and a service cannot be moved between regions afterwards — only rebuilt somewhere else.
    region: ohio
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    # The smallest thing this server serves, because Render asks for it about every five
    # seconds and pays outbound bandwidth on the answer. The buy page was 9,820 bytes, which
    # is roughly five gigabytes a month before a single visitor arrives; robots.txt is 26.
    # It exercises the same path — the router, the address table, a read from disk — so it
    # proves as much about the process being up as the larger page did.
    healthCheckPath: /robots.txt
    # Deploys come from the deploy workflow, after the checks pass, never from Render
    # watching the repository — otherwise a commit that fails its checks ships anyway.
    autoDeploy: false
    envVars:
      # Names only here — this repository is public. The values are written in Infisical and
      # copied onto the service by the deploy workflow, so none of them is ever typed into a
      # hosting dashboard. Render holds the copy the service reads at boot, so nothing has
      # to reach Infisical for the site to start.
      - key: DATABASE_URL
        sync: false
      - key: CARD_ENCRYPTION_KEY
        sync: false
      - key: AUTH_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_CLIENT_ID
        sync: false
      - key: AUTH_CLIENT_SECRET
        sync: false
      - key: ADMIN_ACCOUNT_IDS
        sync: false
      - key: RETELL_SECRET_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: PAY_WISE
        sync: false
      # Proves a scheduled job is the scheduled job. There is no person to sign in for one.
      - key: SWEEP_SECRET
        sync: false
      # The drafting models. Two slots, each a name to show, an address and a key. A slot with
      # no address is not configured and is not offered on the desk, so retiring a model is
      # clearing its values here rather than a code change. Which slot is in use is not a
      # setting — it is a choice the operator makes on the desk, and it lives in the database.
      - key: DRAFT_MODEL_A_NAME
        sync: false
      - key: DRAFT_MODEL_A_URL
        sync: false
      - key: DRAFT_MODEL_A_KEY
        sync: false
      - key: DRAFT_MODEL_B_NAME
        sync: false
      - key: DRAFT_MODEL_B_URL
        sync: false
      - key: DRAFT_MODEL_B_KEY
        sync: false
      # Reads what the drafting worker billed, per endpoint, so the cost screen stops pricing it
      # from a rate somebody typed in. Optional: without it the screen falls back to the rate and
      # says which it is using.
      - key: RUNPOD_API_KEY
        sync: false
      - key: TAXONOMY_URL
        sync: false
      - key: TAXONOMY_TOKEN
        sync: false
      # Reading claimed Skills Economy Directory profiles on the desk. Optional: without both, the
      # desk's Directory link field hides.
      - key: DIRECTORY_SERVICE_URL
        sync: false
      - key: DIRECTORY_SERVICE_TOKEN
        sync: false
