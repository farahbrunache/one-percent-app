# One Percent runs as one small web service. Not serverless: a chat that streams an answer
# and a screen that watches a conversation both need a connection that stays open, and a
# function that is billed by the request cannot hold one.
services:
  - type: web
    name: one-percent-app
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /buy
    # Deploys come from the deploy workflow, after the checks pass, never from Render
    # watching the repository — otherwise a commit that fails its checks ships anyway.
    autoDeploy: false
    envVars:
      # Names only here — this repository is public. The values are written in Infisical and
      # copied onto the service by the deploy workflow, so none of them is ever typed into a
      # hosting dashboard. Render holds the copy the service reads at boot, so nothing has
      # to reach Infisical for the site to start.
      - key: DATABASE_URL
        sync: false
      - key: CARD_ENCRYPTION_KEY
        sync: false
      - key: AUTH_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_CLIENT_ID
        sync: false
      - key: AUTH_CLIENT_SECRET
        sync: false
      - key: ADMIN_ACCOUNT_IDS
        sync: false
      - key: RETELL_SECRET_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: RETELL_WEBHOOK_SECRET
        sync: false
      - key: PAY_WISE
        sync: false
